name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publicar_imagen:
        description: Indica si la imagen debe publicarse en Docker Hub
        required: true
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm test

      - name: Analyze with SonarCloud
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish Jest test results
        if: >-
          always() &&
          (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@v2
        with:
          name: Jest test results
          path: reports/junit.xml
          reporter: jest-junit

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            reports/junit.xml
            coverage/lcov-report/
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --pull -t xaviwill2020/calculadora:${{ github.run_number }} .
          docker tag xaviwill2020/calculadora:${{ github.run_number }} xaviwill2020/calculadora:latest

      - name: Scan image for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:0.76.2 image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            xaviwill2020/calculadora:${{ github.run_number }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.publicar_imagen
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' || inputs.publicar_imagen
        run: |
          docker push xaviwill2020/calculadora:${{ github.run_number }}
          docker push xaviwill2020/calculadora:latest