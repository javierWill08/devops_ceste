name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publicar_imagen:
        description: Indica si la imagen debe publicarse en Docker Hub
        required: true
        default: true
        type: boolean

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build -t xaviwill2020/calculadora:${{ github.run_number }} .
          docker tag xaviwill2020/calculadora:${{ github.run_number }} xaviwill2020/calculadora:latest

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.publicar_imagen
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' || inputs.publicar_imagen
        run: |
          docker push xaviwill2020/calculadora:${{ github.run_number }}
          docker push xaviwill2020/calculadora:latest